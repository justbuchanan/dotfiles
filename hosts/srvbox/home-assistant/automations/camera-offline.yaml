# The frigate integration marks camera.X unavailable once Frigate reports
# camera_fps == 0 for it (stats polled every 5s), so this catches a dead feed
# as well as Frigate or the whole MQTT link going away.
- id: "1788200000009"
  alias: Camera offline
  description: Notify when a camera stops streaming for more than 3 minutes, and
    again when it comes back.
  mode: parallel
  max: 8
  triggers:
    - trigger: state
      id: down
      entity_id:
        - camera.garage
        - camera.frontdoor
        - camera.backyard
        - camera.garden
      to: unavailable
      for: 00:03:00
    - trigger: state
      id: up
      entity_id:
        - camera.garage
        - camera.frontdoor
        - camera.backyard
        - camera.garden
      from: unavailable
      not_to:
        - unavailable
        - unknown
  conditions: []
  actions:
    - variables:
        where:
          "{{ {'camera.frontdoor': 'Front door'}.get(trigger.entity_id, trigger.to_state.name)
          }}"
    - choose:
        - conditions:
            - condition: trigger
              id: down
          sequence:
            - action: notify.mobile_app_justins_iphone
              data:
                title: "\U0001F4F7 Camera offline"
                message: "{{ where }} has not been streaming for 3 minutes."
                data:
                  tag: camera-offline-{{ trigger.entity_id }}
                  url:
                    https://cctv.justbuchanan.com/cameras/{{ trigger.entity_id.split('.')[1]
                    }}
        - conditions:
            - condition: trigger
              id: up
            # Only if the outage was long enough to have alerted; ignore the brief
            # blips that never reached the 3 minute mark.
            - condition: template
              value_template:
                "{{ (trigger.to_state.last_changed - trigger.from_state.last_changed).total_seconds()
                > 180 }}"
          sequence:
            - action: notify.mobile_app_justins_iphone
              data:
                title: "\U0001F4F7 Camera back online"
                message: "{{ where }} is streaming again."
                data:
                  tag: camera-offline-{{ trigger.entity_id }}

# The state triggers above only fire on a transition, so a camera that is
# already unavailable when HA starts never alerts. That's exactly what happens
# when a rebuild restarts HA and Frigate together and Frigate comes back blind
# (e.g. an NVIDIA driver update that breaks CUDA until reboot). The "back
# online" notification above still fires on recovery in that case.
- id: "1788200000012"
  alias: Camera offline at startup
  description: Notify about cameras still unavailable 3 minutes after Home
    Assistant starts.
  mode: single
  triggers:
    - trigger: homeassistant
      event: start
  conditions: []
  actions:
    - delay: 00:03:00
    - variables:
        down: >-
          {{ ['camera.garage', 'camera.frontdoor', 'camera.backyard', 'camera.garden']
             | select('is_state', 'unavailable') | list }}
    - repeat:
        for_each: "{{ down }}"
        sequence:
          - action: notify.mobile_app_justins_iphone
            data:
              title: "\U0001F4F7 Camera offline"
              message:
                "{{ {'camera.frontdoor': 'Front door'}.get(repeat.item, state_attr(repeat.item,
                'friendly_name') or repeat.item) }} has not been streaming since Home
                Assistant started."
              data:
                tag: camera-offline-{{ repeat.item }}
                url: https://cctv.justbuchanan.com/cameras/{{ repeat.item.split('.')[1] }}
