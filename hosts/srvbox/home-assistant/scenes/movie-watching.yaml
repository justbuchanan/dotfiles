# The TV is a cast device: it drops to `unavailable` when off, so the turn-on
# only lands if the panel is reachable.
- id: '1788200000010'
  name: Movie watching
  icon: mdi:movie-open
  entities:
    media_player.living_room_living_room_tv: "on"
    media_player.living_room_soundbar: "on"
    switch.smart_plug_1: "off"
    switch.monstera_light: "off"
    light.den_lights: "off"
    switch.kitchen_lights: "off"
    light.dining_room_light: "off"
